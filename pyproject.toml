[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onenote-sync"
version = "0.1.0"
description = "Pull a shared OneNote section's newest pages to files, and post your section of the week's page."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "m365-graph>=0.1.1",     # sign-in and Graph requests; not on PyPI, see README
    "win-background>=0.1",   # the watcher task, notifications, the lock and the log; not on PyPI, see README
]

[project.scripts]
onenote-sync = "onenote_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
