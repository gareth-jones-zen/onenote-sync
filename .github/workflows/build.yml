name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The shared libraries are a sibling checkout (Directory.Build.props: ..\background-tools-lib).
      - uses: actions/checkout@v5
        with:
          path: onenote-sync
      - uses: actions/checkout@v5
        with:
          repository: gareth-jones-zen/background-tools-lib
          path: background-tools-lib
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: onenote-sync/global.json
      - name: Build and test
        working-directory: onenote-sync
        run: dotnet test -c Release
      - name: Publish (Native AOT)
        working-directory: onenote-sync
        run: |
          dotnet publish src/OneNoteSync.Console -c Release -r win-x64 -o out
          dotnet publish src/OneNoteSync.Background -c Release -r win-x64 -o out
          Get-ChildItem out/*.exe | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: onenote-sync-win-x64
          path: onenote-sync/out/*.exe
